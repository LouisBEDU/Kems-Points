services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LAN_ADDRESS: ${LAN_ADDRESS:-}
      KEEP_ALIVE_TIMEOUT: "75000"
    expose:
      - "3000"

  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
